<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Bibi Blocksberg Tracker</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #111111;
      --card: #161616;
      --card-hover: #1e1e1e;
      --text: #e5e5e5;
      --muted: #8a8a8a;
      --primary: #c0c0c0;
      --primary-dim: #8a8a8a;
      --success: #6ee7b7;
      --border: #2a2a2a;
      --greyed: #555555;
      --accent: #d4d4d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 90px;
      min-height: 100vh;
    }

    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 180px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #555, #c0c0c0);
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .progress-text {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    #search {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    #search::placeholder {
      color: var(--muted);
    }

    #search:focus {
      border-color: #555;
    }

    .filter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: #2a2a2a;
      border-color: #555;
      color: var(--text);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 6px;
      cursor: pointer;
      user-select: none;
    }

    .section-header h2 {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .section-header .chevron {
      color: var(--muted);
      font-size: 0.75rem;
      transition: transform 0.2s;
    }

    .section-header.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .list {
      padding: 8px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list.collapsed {
      display: none;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      transition: background 0.15s, opacity 0.2s;
    }

    .card:active {
      background: var(--card-hover);
    }

    .card.listened {
      opacity: 0.5;
    }

    .card.listened .title,
    .card.listened .desc,
    .card.listened .num,
    .card.listened .year {
      color: var(--greyed);
    }

    .cover {
      width: 96px;
      min-width: 96px;
      height: 96px;
      object-fit: cover;
      background: #222;
    }

    .info {
      flex: 1;
      padding: 10px 12px 10px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }

    .num {
      background: #2a2a2a;
      color: var(--primary);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text);
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
    }

    .year {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 500;
    }

    .desc {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid #3a3a3a;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .checkbox.checked {
      background: var(--success);
      border-color: var(--success);
    }

    .checkbox.checked::after {
      content: "✓";
      color: #0a0a0a;
      font-size: 14px;
      font-weight: 700;
    }

    .status {
      font-size: 0.68rem;
      color: var(--muted);
    }

    .status.done {
      color: var(--success);
      font-weight: 600;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-reset {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-reset:active {
      background: var(--card-hover);
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Bibi Blocksberg</h1>
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="progressText">0/159</div>
      </div>
    </div>
    <div class="search-row">
      <input type="search" id="search" placeholder="Suche Titel oder Nr…" autocomplete="off" />
      <button class="filter-btn" id="filterOpen" onclick="toggleFilter()">Offen</button>
    </div>
  </header>

  <div id="openSection">
    <div class="section-header" onclick="toggleSection('open')">
      <h2 id="openLabel">Noch zu hören</h2>
      <span class="chevron">▼</span>
    </div>
    <div class="list" id="openList"></div>
  </div>

  <div id="doneSection">
    <div class="section-header" id="doneHeader" onclick="toggleSection('done')">
      <h2 id="doneLabel">Gehört</h2>
      <span class="chevron">▼</span>
    </div>
    <div class="list" id="doneList"></div>
  </div>

  <footer>
    <button class="btn-reset" onclick="resetAll()">Alles zurücksetzen</button>
  </footer>

  <script>
    const episodes = [
      {id:1, title:"Hexen gibt es doch", year:1980, desc:"Erst seit kurzer Zeit wohnen die Blocksbergs in Neustadt. Doch schon bald merken die Nachbarn: Das ist keine normale Familie. Herr Müller behauptet sogar, die kleine Bibi fliege manchmal auf einem Besen durch die Luft."},
      {id:2, title:"Hexerei in der Schule", year:1980, desc:"Natürlich ist Bibi noch keine fertige Hexe, doch einen Hexenbesen hat sie schon. Als sie eines Tages die Nase ihres Lehrers verhext, gibt es große Schwierigkeiten."},
      {id:3, title:"Die Zauberlimonade", year:1980, desc:"Boris wird fast von einem Auto überfahren. Bibi will den Bürgermeister verhexen, weil er versprochene Radwege nicht gebaut hat, und mixt eine Zauberlimonade."},
      {id:4, title:"Der Bankräuber", year:1980, desc:"Bibi lernt einen neuen Spruch, mit dem sie Hunde zum Reden bringen kann. Sie ahnt nicht, was sie damit anrichten wird, als ein Bankräuber sein Unwesen treibt."},
      {id:5, title:"Ein verhexter Urlaub", year:1980, desc:"Die Blocksbergs fahren an die See. Nicht alle Urlaubsgäste können den Lärm verstehen – Bibi überlegt sich einen tollen Hexspruch, um das zu ändern."},
      {id:6, title:"Die Kuh im Schlafzimmer", year:1982, desc:"Vater Blocksberg will frische Landmilch und knusprigen Schweinebraten. Am besten, man würde alles selber züchten. Doch in der Stadt ist das ja nicht möglich. Oder doch?"},
      {id:7, title:"… heilt den Bürgermeister", year:1982, desc:"Der Bürgermeister hat zu viel gegessen und redet nur dummes Zeug. Bibi tut er leid und sie möchte ihn gesund hexen – doch das hätte sie besser nicht tun sollen."},
      {id:8, title:"Die Schlossgespenster", year:1983, desc:"Bibi ist bei ihren Verwandten in Irland in einem alten Schloss. Das Schloss kostet zu viel und droht verkauft zu werden. Bibi und Cousine Margie stecken die Köpfe zusammen."},
      {id:9, title:"… verliebt sich", year:1983, desc:"Bibi verliebt sich zum ersten Mal. Natürlich läuft nicht alles glatt, und die Hexerei macht die Sache nur noch komplizierter."},
      {id:10, title:"Bibis neue Freundin", year:1983, desc:"Moni zieht aus Kleinpreißnitz nach Neustadt und kommt in Bibis Klasse. Anfangs unbeliebt, wird sie mit Bibis Hilfe zu einer echten Freundin."},
      {id:11, title:"Der Schulausflug", year:1983, desc:"Beim Schulausflug geht einiges schief. Bibi greift zu Hexsprüchen, um die Lage zu retten – mit den üblichen chaotischen Folgen."},
      {id:12, title:"… hat Geburtstag", year:1983, desc:"Bibi hat Geburtstag und wünscht sich ein ganz besonderes Fest. Die Familie und Freunde sorgen für Überraschungen – und ein bisschen Hexerei."},
      {id:13, title:"Ein verhexter Sonntag", year:1983, desc:"An einem Sonntag gerät bei den Blocksbergs alles durcheinander. Bibis Hexerei macht den Tag noch verrückter als geplant."},
      {id:14, title:"… in Amerika", year:1984, desc:"Die Blocksbergs reisen nach Amerika. In der neuen Umgebung erlebt Bibi Abenteuer und setzt ihre Hexkräfte ein."},
      {id:15, title:"Die schwarzen Vier", year:1984, desc:"Vier geheimnisvolle Gestalten sorgen für Unruhe in Neustadt. Bibi und ihre Freunde kommen dem Rätsel auf die Spur."},
      {id:16, title:"Das Schulfest", year:1984, desc:"Beim Schulfest soll alles reibungslos laufen. Bibis gut gemeinte Hexereien sorgen jedoch für einiges Chaos."},
      {id:17, title:"Der kleine Hexer", year:1984, desc:"Bibi trifft den kleinen Hexer Carlo. Gemeinsam erleben sie Abenteuer und stellen fest, dass auch Jungen hexen können."},
      {id:18, title:"Auf dem Hexenberg", year:1984, desc:"Bibi fliegt zum Hexenberg und trifft andere Junghexen. Dort lernt sie Schubia Wanzhaar und die Regeln der Hexengemeinschaft kennen."},
      {id:19, title:"Das Sportfest", year:1984, desc:"Beim Sportfest will Bibi glänzen. Doch ohne Hexerei ist das gar nicht so einfach – und mit Hexerei wird es chaotisch."},
      {id:20, title:"Papa ist weg", year:1984, desc:"Bernhard ist verschwunden. Bibi und Barbara machen sich auf die Suche und erleben dabei ein spannendes Abenteuer."},
      {id:21, title:"… zieht um", year:1984, desc:"Die Blocksbergs sollen umziehen. Bibi ist alles andere als begeistert und versucht, das mit Hexerei zu verhindern."},
      {id:22, title:"3× schwarzer Kater", year:1984, desc:"Oma Grete schenkt den Blocksbergs den Hexenkater Sylvester. Der neue Mitbewohner sorgt für allerlei Chaos im Haus."},
      {id:23, title:"… und der Autostau", year:1985, desc:"Ein riesiger Autostau legt Neustadt lahm. Bibi versucht, mit Hexerei für Abhilfe zu sorgen – und schafft neue Probleme."},
      {id:24, title:"… und der Supermarkt", year:1985, desc:"Im Supermarkt geht es drunter und drüber. Bibis Hexsprüche machen aus dem Einkauf ein wildes Abenteuer."},
      {id:25, title:"… reißt aus", year:1985, desc:"Bibi hat genug und reißt aus. Unterwegs erlebt sie allerlei Abenteuer, bis die Familie sie wiederfindet."},
      {id:26, title:"Die Schnitzeljagd", year:1985, desc:"Eine große Schnitzeljagd durch Neustadt steht an. Bibi und ihre Freunde sind mittendrin und sorgen für Überraschungen."},
      {id:27, title:"Die verhexte Hitparade", year:1985, desc:"Bibi mischt sich in die Hitparade ein. Mit ein paar Hexsprüchen wird aus dem Musikwettbewerb ein chaotisches Spektakel."},
      {id:28, title:"… im Dschungel", year:1985, desc:"Bibi gerät in den Dschungel und muss sich mit Tieren und Gefahren auseinandersetzen – natürlich mit Hexerei."},
      {id:29, title:"Der neue Hexenbesen", year:1985, desc:"Kartoffelbrei braucht eine Pause. Bibi bekommt einen neuen Besen und muss erst einmal lernen, mit ihm umzugehen."},
      {id:30, title:"… in der Ritterzeit", year:1985, desc:"Durch einen Hexunfall landet Bibi in der Ritterzeit. Dort erlebt sie mittelalterliche Abenteuer und sucht den Weg zurück."},
      {id:31, title:"Auf der Märcheninsel", year:1985, desc:"Bibi und ihre Freunde geraten auf eine geheimnisvolle Märcheninsel voller magischer Wesen und Abenteuer."},
      {id:32, title:"… als Prinzessin", year:1986, desc:"Bibi wird zur Prinzessin verhext – oder verhext sich selbst. Das königliche Leben ist allerdings anstrengender als gedacht."},
      {id:33, title:"… als Babysitter", year:1986, desc:"Bibi soll auf ein Baby aufpassen. Mit Hexerei scheint das leicht – doch das Kleine hat ganz eigene Ideen."},
      {id:34, title:"… darf nicht hexen", year:1986, desc:"Bibi bekommt ein Hexverbot. Ohne ihre Kräfte muss sie sich ganz normal durch den Alltag kämpfen."},
      {id:35, title:"Der Hexenfluch", year:1986, desc:"Ein alter Hexenfluch trifft die Blocksbergs. Bibi muss herausfinden, wie man ihn wieder lösen kann."},
      {id:36, title:"Die weißen Enten", year:1986, desc:"Weiße Enten sorgen für Aufregung in Neustadt. Hinter dem scheinbar harmlosen Vorfall steckt mehr, als man denkt."},
      {id:37, title:"Der Flohmarkt", year:1987, desc:"Auf dem Flohmarkt findet Bibi merkwürdige Dinge. Ein besonderer Fund löst eine ganze Kette von Ereignissen aus."},
      {id:38, title:"Die Weihnachtsmänner", year:1987, desc:"Zu Weihnachten geht einiges schief. Mehrere Weihnachtsmänner und Bibis Hexerei sorgen für ein turbulentes Fest."},
      {id:39, title:"Unverhofftes Wiedersehen", year:1988, desc:"Ein unverhofftes Wiedersehen bringt alte Bekannte zurück nach Neustadt und sorgt für Überraschungen bei den Blocksbergs."},
      {id:40, title:"… und die Vampire", year:1988, desc:"Vampire in Neustadt? Bibi und ihre Freunde geraten in ein gruseliges und zugleich lustiges Abenteuer."},
      {id:41, title:"Ohne Mami geht es nicht", year:1989, desc:"Barbara ist weg und die Familie muss ohne sie zurechtkommen. Schnell wird klar: Ohne Mami geht es wirklich nicht."},
      {id:42, title:"… im Zirkus", year:1989, desc:"Bibi landet im Zirkus und mischt die Vorstellungen mit ihren Hexkräften ordentlich auf."},
      {id:43, title:"Der Reiterhof – Teil 1", year:1989, desc:"Bibi kommt auf einen Reiterhof. Zwischen Pferden, Reitstunden und neuen Freunden beginnt ein spannendes Abenteuer."},
      {id:44, title:"Der Reiterhof – Teil 2", year:1989, desc:"Das Abenteuer auf dem Reiterhof geht weiter. Bibi und Tina erleben weitere turbulente und herzliche Momente."},
      {id:45, title:"Das Lufttaxi", year:1990, desc:"Ein Lufttaxi sorgt für Aufsehen. Bibi mischt sich ein und macht aus der Idee ein hexerisches Transportmittel."},
      {id:46, title:"Karla gibt nicht auf", year:1990, desc:"Reporterin Karla Kolumna ist einer großen Story auf der Spur und lässt sich von nichts und niemandem abhalten."},
      {id:47, title:"Das Reitturnier", year:1990, desc:"Ein großes Reitturnier steht an. Bibi und ihre Freunde vom Reiterhof wollen unbedingt gewinnen."},
      {id:48, title:"… ist krank", year:1990, desc:"Bibi ist krank und muss im Bett bleiben. Natürlich hält sie es dort nicht lange aus und sucht nach hexerischen Lösungen."},
      {id:49, title:"Der Hexengeburtstag", year:1990, desc:"Ein besonderer Hexengeburtstag wird gefeiert. Junghexen aus der ganzen Gegend kommen zusammen und feiern ausgelassen."},
      {id:50, title:"… im Orient", year:1991, desc:"Bibi reist in den Orient und erlebt dort märchenhafte Abenteuer mit fliegenden Teppichen und geheimnisvollen Wesen."},
      {id:51, title:"… wird entführt", year:1991, desc:"Bibi wird entführt! Die Familie und Freunde setzen alles daran, sie zu finden und zu befreien."},
      {id:52, title:"Wo ist Kartoffelbrei?", year:1991, desc:"Kartoffelbrei ist verschwunden. Bibi macht sich auf die Suche nach ihrem geliebten Besen und gerät in Schwierigkeiten."},
      {id:53, title:"Der Superhexspruch", year:1992, desc:"Bibi entdeckt einen Superhexspruch, der unglaubliche Kräfte freisetzt – und natürlich auch Chaos verursacht."},
      {id:54, title:"Die Computerhexe", year:1992, desc:"Computer und Hexerei treffen aufeinander. Bibi versucht, die neue Technik mit magischen Mitteln zu meistern."},
      {id:55, title:"Mamis Geburtstag", year:1992, desc:"Barbara hat Geburtstag. Bibi will ihr ein ganz besonderes Geschenk machen – mit den üblichen hexerischen Folgen."},
      {id:56, title:"Der Wetterfrosch", year:1993, desc:"Ein Wetterfrosch soll das Wetter vorhersagen. Bibi mischt sich ein und sorgt für unerwartete Wetterkapriolen."},
      {id:57, title:"Der blaue Brief", year:1993, desc:"Ein blauer Brief droht. Bibi versucht, die Situation zu retten, bevor die schlechte Nachricht bei den Eltern ankommt."},
      {id:58, title:"… und das Dino-Ei", year:1993, desc:"Bibi findet ein geheimnisvolles Ei. Als daraus ein Dinosaurier schlüpft, beginnt ein wildes Abenteuer."},
      {id:59, title:"… und Dino", year:1994, desc:"Der kleine Dino wächst heran und sorgt für jede Menge Chaos bei den Blocksbergs und in ganz Neustadt."},
      {id:60, title:"Der Geisterkater", year:1994, desc:"Ein Geisterkater spukt umher. Bibi und Sylvester müssen dem unheimlichen Besucher auf den Grund gehen."},
      {id:61, title:"Der Flaschengeist", year:1994, desc:"Bibi findet einen Flaschengeist. Drei Wünsche stehen ihr zu – doch Wünsche können auch nach hinten losgehen."},
      {id:62, title:"Das feuerrote Nashorn", year:1995, desc:"Ein feuerrotes Nashorn taucht auf und sorgt für Aufregung. Bibi kommt dem Geheimnis hinter dem seltsamen Tier auf die Spur."},
      {id:63, title:"Die Wahrsagerin", year:1995, desc:"Eine Wahrsagerin prophezeit Großes. Der Bürgermeister lässt sich blenden und Bibi muss die Lage retten."},
      {id:64, title:"Die neue Schule", year:1996, desc:"Eine neue Schule wird gebaut. Der Bürgermeister hat grandiose Pläne – Bibi findet, dass etwas ganz anders laufen sollte."},
      {id:65, title:"Das Wettfliegen", year:1996, desc:"Ein großes Wettfliegen der Hexen steht an. Bibi will unbedingt gewinnen und trainiert mit Kartoffelbrei."},
      {id:66, title:"Das verhexte Osterei", year:1997, desc:"Zu Ostern findet Bibi ein verhextes Osterei. Was daraus schlüpft, überrascht die ganze Familie."},
      {id:67, title:"Der weiße Kakadu", year:1997, desc:"Ein weißer Kakadu kommt zu den Blocksbergs. Das gesprächige Tier sorgt für Chaos und verrät so manches Geheimnis."},
      {id:68, title:"… und die Piraten", year:1997, desc:"Piraten kreuzen den Weg von Bibi. Gemeinsam mit Freunden erlebt sie ein abenteuerliches Piratenabenteuer."},
      {id:69, title:"Verhexte Weihnachten", year:1998, desc:"Weihnachten droht schiefzugehen. Bibis Hexerei und ein paar Missgeschicke machen das Fest unvergesslich."},
      {id:70, title:"Das gestohlene Hexenkraut", year:1999, desc:"Wichtiges Hexenkraut wurde gestohlen. Bibi und die anderen Hexen machen sich auf die Suche nach dem Dieb."},
      {id:71, title:"Die Hexenschule", year:1999, desc:"Bibi besucht die Hexenschule. Zwischen Unterricht, Prüfungen und Streichen erlebt sie den Schulalltag der Hexen."},
      {id:72, title:"Der verhexte Kalender", year:2000, desc:"Ein verhexter Kalender bringt die Zeit durcheinander. Bibi muss herausfinden, wie man die Tage wieder sortiert."},
      {id:73, title:"Freitag, der 13.", year:2000, desc:"Freitag, der 13. bringt Pech über Pech. Bibi versucht, den Unglückstag mit Hexerei in den Griff zu bekommen."},
      {id:74, title:"Der Brieffreund", year:2001, desc:"Bibi bekommt einen Brieffreund. Die Korrespondenz führt zu Überraschungen und einem unerwarteten Treffen."},
      {id:75, title:"Die neue Lehrerin", year:2001, desc:"Eine neue Lehrerin kommt in die Klasse. Bibi und die anderen müssen sich an den neuen Unterrichtsstil gewöhnen."},
      {id:76, title:"Schubia dreht durch", year:2002, desc:"Schubia Wanzhaar dreht völlig durch. Bibi muss ihrer Freundin helfen, wieder ins Gleichgewicht zu kommen."},
      {id:77, title:"… im Hexeninternat", year:2002, desc:"Bibi kommt ins Hexeninternat. Dort treffen sich Junghexen aus aller Welt und erleben gemeinsame Abenteuer."},
      {id:78, title:"… und Elea Eluanda", year:2003, desc:"Bibi trifft Elea Eluanda. Gemeinsam mit der Elfe erlebt sie magische und aufregende Stunden."},
      {id:79, title:"Papis Geburtstag", year:2003, desc:"Bernhard hat Geburtstag. Bibi und Barbara planen eine Überraschung, die natürlich nicht ganz ohne Hexerei auskommt."},

      {id:156, title:"Die Vertretungshexlehrerin", year:2025, desc:"Eine Vertretungshexlehrerin übernimmt den Unterricht. Die Klasse und Bibi müssen sich auf neue Methoden einstellen."},
      {id:157, title:"Team Blocksberg", year:2025, desc:"Team Blocksberg schließt sich zusammen. Gemeinsam meistern sie eine große Herausforderung."},

      {id:159, title:"Ins Bild gehext!", year:2025, desc:"Bibi hext jemanden ins Bild. Was als Spaß beginnt, wird zu einem ungewöhnlichen Abenteuer."}
    ].map(ep => ({
      ...ep,
      cover: `https://www.bibiblocksberg.de/sites/default/files/styles/max_2600x2600/public/hoerspiele/ep_image/Bibi_Blocksberg_${String(ep.id).padStart(3,"0")}.jpg.webp`
    }));

    const STORAGE_KEY = "bibi-tracker-v2";
    const TOTAL = episodes.length;

    let showOnlyOpen = false;
    let openCollapsed = false;
    let doneCollapsed = false;

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function toggle(id) {
      const state = loadState();
      state[id] = !state[id];
      saveState(state);
      render();
    }

    function resetAll() {
      if (confirm("Wirklich alle Haken zurücksetzen?")) {
        localStorage.removeItem(STORAGE_KEY);
        render();
      }
    }

    function toggleFilter() {
      showOnlyOpen = !showOnlyOpen;
      document.getElementById("filterOpen").classList.toggle("active", showOnlyOpen);
      render();
    }

    function toggleSection(which) {
      if (which === "open") {
        openCollapsed = !openCollapsed;
        document.querySelector("#openSection .section-header").classList.toggle("collapsed", openCollapsed);
        document.getElementById("openList").classList.toggle("collapsed", openCollapsed);
      } else {
        doneCollapsed = !doneCollapsed;
        document.getElementById("doneHeader").classList.toggle("collapsed", doneCollapsed);
        document.getElementById("doneList").classList.toggle("collapsed", doneCollapsed);
      }
    }

    function createCard(ep, checked) {
      const card = document.createElement("div");
      card.className = "card" + (checked ? " listened" : "");
      card.dataset.id = ep.id;
      card.innerHTML = `
        <img class="cover" src="${ep.cover}" alt="Cover ${ep.id}" loading="lazy"
             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2296%22 height=%2296%22%3E%3Crect fill=%22%23222%22 width=%2296%22 height=%2296%22/%3E%3Ctext x=%2248%22 y=%2254%22 text-anchor=%22middle%22 fill=%22%23aaa%22 font-size=%2220%22%3E${ep.id}%3C/text%3E%3C/svg%3E'">
        <div class="info">
          <div>
            <div class="title-row">
              <span class="num">#${ep.id}</span>
              <div class="title">${ep.title}</div>
            </div>
            <div class="meta"><span class="year">${ep.year}</span></div>
            <div class="desc">${ep.desc}</div>
          </div>
          <div class="check-row">
            <span class="status ${checked ? "done" : ""}">${checked ? "Gehört ✓" : "Noch nicht"}</span>
            <div class="checkbox ${checked ? "checked" : ""}" onclick="toggle(${ep.id})"></div>
          </div>
        </div>
      `;
      return card;
    }

    function render() {
      const state = loadState();
      const query = (document.getElementById("search").value || "").trim().toLowerCase();

      const openList = document.getElementById("openList");
      const doneList = document.getElementById("doneList");
      openList.innerHTML = "";
      doneList.innerHTML = "";

      let doneCount = 0;
      let openCount = 0;
      let visibleOpen = 0;
      let visibleDone = 0;

      episodes.forEach(ep => {
        const checked = !!state[ep.id];
        if (checked) doneCount++;
        else openCount++;

        const match = !query ||
          String(ep.id).includes(query) ||
          ep.title.toLowerCase().includes(query) ||
          String(ep.year).includes(query) ||
          ep.desc.toLowerCase().includes(query);

        if (!match) return;
        if (showOnlyOpen && checked) return;

        const card = createCard(ep, checked);
        if (checked) {
          doneList.appendChild(card);
          visibleDone++;
        } else {
          openList.appendChild(card);
          visibleOpen++;
        }
      });

      document.getElementById("openLabel").textContent =
        `Noch zu hören${openCount ? ` (${openCount})` : ""}`;
      document.getElementById("doneLabel").textContent =
        `Gehört${doneCount ? ` (${doneCount})` : ""}`;

      if (visibleOpen === 0 && !query) {
        openList.innerHTML = `<div class="empty">Alles gehört – stark!</div>`;
      } else if (visibleOpen === 0) {
        openList.innerHTML = `<div class="empty">Keine Treffer</div>`;
      }

      if (visibleDone === 0) {
        doneList.innerHTML = `<div class="empty">Noch nichts gehört</div>`;
      }

      document.getElementById("doneSection").classList.toggle("hidden", showOnlyOpen);

      const pct = (doneCount / TOTAL) * 100;
      document.getElementById("progressFill").style.width = pct + "%";
      document.getElementById("progressText").textContent = `${doneCount}/${TOTAL}`;
    }

    document.getElementById("search").addEventListener("input", render);
    render();
  </script>
</body>
</html>
