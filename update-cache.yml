name: Update AniList cache dump

on:
  schedule:
    - cron: '0 4 * * 1'   # every Monday 04:00 UTC
  workflow_dispatch:        # manual run button in GitHub UI

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Worker
        run: curl -fsS "https://anilist-cache.sylphrena1507.workers.dev/admin/push-now"