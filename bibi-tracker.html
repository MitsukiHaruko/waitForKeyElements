<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1625" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Bibi Blocksberg Tracker</title>
  <style>
    :root {
      --bg: #0f0c15;
      --bg2: #16121f;
      --card: #1c1826;
      --card-hover: #241f30;
      --text: #e8e4f0;
      --muted: #9b93ab;
      --primary: #a78bfa;
      --primary-dim: #7c5cbf;
      --success: #34d399;
      --border: #2a2438;
      --greyed: #4a4458;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 90px;
      min-height: 100vh;
    }

    /* Compact header */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 180px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-dim), var(--primary));
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .progress-text {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Search */
    .search-row {
      display: flex;
      gap: 8px;
    }

    #search {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    #search::placeholder {
      color: var(--muted);
    }

    #search:focus {
      border-color: var(--primary-dim);
    }

    .filter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: var(--primary-dim);
      border-color: var(--primary);
      color: white;
    }

    /* Sections */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 6px;
      cursor: pointer;
      user-select: none;
    }

    .section-header h2 {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .section-header .chevron {
      color: var(--muted);
      font-size: 0.75rem;
      transition: transform 0.2s;
    }

    .section-header.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .list {
      padding: 8px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list.collapsed {
      display: none;
    }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      transition: background 0.15s, opacity 0.2s;
    }

    .card:active {
      background: var(--card-hover);
    }

    .card.listened {
      opacity: 0.55;
    }

    .card.listened .title,
    .card.listened .desc,
    .card.listened .num,
    .card.listened .year {
      color: var(--greyed);
    }

    .cover {
      width: 96px;
      min-width: 96px;
      height: 96px;
      object-fit: cover;
      background: #2a2438;
    }

    .info {
      flex: 1;
      padding: 10px 12px 10px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }

    .num {
      background: rgba(167, 139, 250, 0.15);
      color: var(--primary);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text);
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
    }

    .year {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 500;
    }

    .desc {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid #3d364f;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .checkbox.checked {
      background: var(--success);
      border-color: var(--success);
    }

    .checkbox.checked::after {
      content: "✓";
      color: #0f0c15;
      font-size: 14px;
      font-weight: 700;
    }

    .status {
      font-size: 0.68rem;
      color: var(--muted);
    }

    .status.done {
      color: var(--success);
      font-weight: 600;
    }

    /* Footer */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-reset {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-reset:active {
      background: var(--card-hover);
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

    <div class="header-top">
      <h1>Bibi Blocksberg</h1>
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

    </div>
    <div class="search-row">

      <button class="filter-btn" id="filterOpen" onclick="toggleFilter()">Offen</button>
    </div>
  </header>

    </div>
    <div class="list" id="openList"></div>

  <div id="doneSection">

  </div>

  <footer>
    <button class="btn-reset" onclick="resetAll()">Alles zurücksetzen</button>

    const STORAGE_KEY = "bibi-tracker-v2";
    const TOTAL = episodes.length;

    let showOnlyOpen = false;
    let openCollapsed = false;
    let doneCollapsed = false;

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function toggle(id) {
      const state = loadState();
      state[id] = !state[id];
      saveState(state);
      render();
    }

    function resetAll() {
      if (confirm("Wirklich alle Haken zurücksetzen?")) {
        localStorage.removeItem(STORAGE_KEY);
        render();
      }
    }

    function toggleFilter() {
      showOnlyOpen = !showOnlyOpen;
      document.getElementById("filterOpen").classList.toggle("active", showOnlyOpen);
      render();
    }

    function toggleSection(which) {
      if (which === "open") {
        openCollapsed = !openCollapsed;
        document.querySelector("#openSection .section-header").classList.toggle("collapsed", openCollapsed);
        document.getElementById("openList").classList.toggle("collapsed", openCollapsed);
      } else {
        doneCollapsed = !doneCollapsed;
        document.getElementById("doneHeader").classList.toggle("collapsed", doneCollapsed);
        document.getElementById("doneList").classList.toggle("collapsed", doneCollapsed);
      }
    }

    function createCard(ep, checked) {
      const card = document.createElement("div");
      card.className = "card" + (checked ? " listened" : "");
      card.dataset.id = ep.id;
      const descHtml = ep.desc ? `<div class="desc">${ep.desc}</div>` : "";
      card.innerHTML = `
        <img class="cover" src="${ep.cover}" alt="Cover ${ep.id}" loading="lazy"
             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2296%22 height=%2296%22%3E%3Crect fill=%22%232a2438%22 width=%2296%22 height=%2296%22/%3E%3Ctext x=%2248%22 y=%2254%22 text-anchor=%22middle%22 fill=%22%23a78bfa%22 font-size=%2220%22%3E${ep.id}%3C/text%3E%3C/svg%3E'">
        <div class="info">
          <div>
            <div class="title-row">
              <span class="num">#${ep.id}</span>
              <div class="title">${ep.title}</div>
            </div>
            <div class="meta"><span class="year">${ep.year}</span></div>
            ${descHtml}
          </div>
          <div class="check-row">
            <span class="status ${checked ? "done" : ""}">${checked ? "Gehört ✓" : "Noch nicht"}</span>
            <div class="checkbox ${checked ? "checked" : ""}" onclick="toggle(${ep.id})"></div>
          </div>
        </div>
      `;
      return card;
    }

    function render() {
      const state = loadState();
      const query = (document.getElementById("search").value || "").trim().toLowerCase();

      const openList = document.getElementById("openList");
      const doneList = document.getElementById("doneList");
      openList.innerHTML = "";
      doneList.innerHTML = "";

      let doneCount = 0;
      let openCount = 0;
      let visibleOpen = 0;
      let visibleDone = 0;

      episodes.forEach(ep => {
        const checked = !!state[ep.id];
        if (checked) doneCount++;
        else openCount++;

        const match = !query ||
          String(ep.id).includes(query) ||
          ep.title.toLowerCase().includes(query) ||
          String(ep.year).includes(query);

        if (!match) return;
        if (showOnlyOpen && checked) return;

        const card = createCard(ep, checked);
        if (checked) {
          doneList.appendChild(card);
          visibleDone++;
        } else {
          openList.appendChild(card);
          visibleOpen++;
        }
      });

      document.getElementById("openLabel").textContent =
        `Noch zu hören${openCount ? ` (${openCount})` : ""}`;
      document.getElementById("doneLabel").textContent =
        `Gehört${doneCount ? ` (${doneCount})` : ""}`;

      if (visibleOpen === 0 && !query) {
        openList.innerHTML = `<div class="empty">Alles gehört – stark!</div>`;
      } else if (visibleOpen === 0) {
        openList.innerHTML = `<div class="empty">Keine Treffer</div>`;
      }

      if (visibleDone === 0) {
        doneList.innerHTML = `<div class="empty">Noch nichts gehört</div>`;
      }

      // hide done section entirely when filter is on
      document.getElementById("doneSection").classList.toggle("hidden", showOnlyOpen);

      const pct = (doneCount / TOTAL) * 100;
      document.getElementById("progressFill").style.width = pct + "%";
      document.getElementById("progressText").textContent = `${doneCount}/${TOTAL}`;
    }

    document.getElementById("search").addEventListener("input", render);
    render();
  </script>
</body>
</html>
